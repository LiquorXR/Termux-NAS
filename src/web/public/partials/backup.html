<div class="card">
  <h2>新建备份任务</h2>
  <p>将源目录备份到目标目录(目标可填远程 rsync 地址,如 <code>user@host:/path</code>)。定时表达式为 5 字段 cron(分 时 日 月 周),留空表示仅手动执行。</p>
  <div class="form-grid" style="margin-top:12px">
    <div><label>任务名</label><input id="bk-name" placeholder="如:照片备份"></div>
    <div><label>源目录</label><input id="bk-src" placeholder="/storage/shared/DCIM"></div>
    <div><label>目标目录</label><input id="bk-dst" placeholder="/storage/shared/backup"></div>
    <div><label>定时(cron)</label><input id="bk-sched" placeholder="0 3 * * *"></div>
  </div>
  <div class="ftools" style="margin-top:12px">
    <button type="button" class="btn primary sm" onclick="bkCreate()">创建任务</button>
  </div>
</div>

<div class="card">
  <div class="fbar">
    <h2>备份任务</h2>
    <span class="fcount" id="bk-count"></span>
  </div>
  <table class="ftable">
    <thead>
      <tr><th>任务</th><th>状态</th><th class="col-optional">上次运行</th><th class="col-optional">上次大小</th><th style="text-align:right">操作</th></tr>
    </thead>
    <tbody id="bk-rows">
      <tr><td colspan="5" class="fempty">加载中…</td></tr>
    </tbody>
  </table>
</div>

<script>
(function () {
  var stateText = { ok: '成功', error: '失败', running: '执行中', '': '未运行' };
  var stateBadge = { ok: 'badge ok', error: 'badge err', running: 'badge warn', '': 'badge' };

  function bkAct(id, action, btn) {
    window.setBtnLoading(btn, true);
    fetch('/api/backup/' + action, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) toast(res.j.error || '操作失败', 'err');
        else if (action === 'restore') toast('恢复任务已启动', 'ok');
        load();
      })
      .catch(function () { toast('网络错误', 'err'); load(); })
      .finally(function () { window.setBtnLoading(btn, false); });
  }

  function bkDelete(id) {
    confirmDialog('删除任务', '确定删除备份任务?').then(function (ok) {
      if (!ok) return;
      fetch('/api/backup/jobs/' + id, { method: 'DELETE' })
        .then(function () { toast('已删除', 'ok'); load(); })
        .catch(function () { toast('网络错误', 'err'); });
    });
  }

  function render(list) {
    var tbody = document.getElementById('bk-rows');
    document.getElementById('bk-count').textContent = '共 ' + list.length + ' 个';
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="fempty">暂无备份任务,请在上方创建</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(function (j) {
      var running = j.last_status === 'running';
      var btns = '';
      btns += '<button class="btn sm" onclick="bkAct(' + j.id + ',\'run\',this)" ' + (running ? 'disabled' : '') + '>立即备份</button>';
      btns += '<button class="btn sm" onclick="bkAct(' + j.id + ',\'restore\',this)" ' + (running ? 'disabled' : '') + '>恢复</button>';
      btns += '<button class="btn sm danger" onclick="bkDelete(' + j.id + ')">删除</button>';
      var info = '<div style="font-size:11px;color:var(--muted)">' +
        '<span title="源">' + j.source + '</span> → <span title="目标">' + j.target + '</span>' +
        (j.schedule ? ' · <span title="定时">' + j.schedule + '</span>' : ' · 手动') +
        (j.enabled ? '' : ' · 已停用') + '</div>';
      return '<tr>' +
        '<td>' + j.name + info + '</td>' +
        '<td><span class="' + (stateBadge[j.last_status] || 'badge') + '">' + (stateText[j.last_status] || j.last_status) + '</span></td>' +
        '<td class="col-optional">' + window.fmtTime(j.last_run) + '</td>' +
        '<td class="col-optional">' + window.humanSize(j.last_size) + '</td>' +
        '<td style="text-align:right;white-space:nowrap">' + btns + '</td>' +
        '</tr>';
    }).join('');
  }

  function load() {
    fetch('/api/backup/jobs')
      .then(function (r) { return r.json(); })
      .then(function (j) { render(j.jobs || []); })
      .catch(function () {});
  }

  function bkCreate() {
    var name = document.getElementById('bk-name').value.trim();
    var src = document.getElementById('bk-src').value.trim();
    var dst = document.getElementById('bk-dst').value.trim();
    var sched = document.getElementById('bk-sched').value.trim();
    if (!name || !src || !dst) { toast('任务名/源/目标必填', 'err'); return; }
    fetch('/api/backup/jobs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, source: src, target: dst, schedule: sched })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.ok) {
          toast('创建成功', 'ok');
          ['bk-name', 'bk-src', 'bk-dst', 'bk-sched'].forEach(function (id) {
            document.getElementById(id).value = '';
          });
          load();
        } else toast(res.j.error || '创建失败', 'err');
      })
      .catch(function () { toast('网络错误', 'err'); });
  }

  window.bkAct = bkAct;
  window.bkDelete = bkDelete;
  window.bkCreate = bkCreate;
  load();
  setInterval(load, 5000);
})();
</script>
