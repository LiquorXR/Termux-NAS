<div class="card">
  <div class="fbar">
    <h2>插件市场</h2>
    <span class="fcount" id="mk-name" aria-live="polite"></span>
  </div>
  <p style="color:var(--muted);font-size:13px">浏览并一键安装社区插件。安装后请到「插件」页启动。</p>
  <div class="mk-grid" id="mk-grid" aria-live="polite">
    <div class="empty-state">加载中…</div>
  </div>
</div>

<script>
(function () {
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function install(id, btn) {
    window.setBtnLoading(btn, true);
    fetch('/api/market/install', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ id: id })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.ok) toast('安装成功,可在「插件」页启动', 'ok');
        else toast(res.j.error || '安装失败', 'err');
        load();
      })
      .catch(function () { toast('网络错误', 'err'); load(); })
      .finally(function () { window.setBtnLoading(btn, false); });
  }

  function render(m) {
    var grid = document.getElementById('mk-grid');
    if(!grid) return;
    var nameEl = document.getElementById('mk-name');
    if(nameEl) nameEl.textContent = m.name || '';
    if (!m.plugins || !m.plugins.length) {
      grid.innerHTML = '<div class="empty-state">市场暂无插件</div>';
      return;
    }
    grid.innerHTML = m.plugins.map(function (p) {
      var btn = p.installed
        ? '<button type="button" class="btn sm" disabled aria-label="已安装 ' + esc(p.name) + '">已安装</button>'
        : '<button type="button" class="btn sm primary" data-mk="' + esc(p.id) + '" aria-label="安装 ' + esc(p.name) + '">安装</button>';
      return '<div class="mk-card">' +
        '<div class="mk-card-head">' +
          '<div class="mk-card-icon" aria-hidden="true"><svg class="fic"><use href="#i-package"/></svg></div>' +
          '<div><div class="mk-card-name">' + esc(p.name) + '</div>' +
          '<div class="mk-card-ver">v' + esc(p.version) + '</div></div>' +
        '</div>' +
        '<div class="mk-card-desc">' + esc(p.description) + '</div>' +
        '<div class="mk-card-foot">' +
          '<span style="font-size:11px;color:var(--muted)">' +
            '作者:' + esc(p.author || '-') + (p.size_hint ? ' · ' + esc(p.size_hint) : '') +
          '</span>' +
          btn +
        '</div>' +
        '</div>';
    }).join('');
  }

  function load() {
    var grid = document.getElementById('mk-grid');
    if(!grid) return;
    fetch('/api/market', { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (j) { render(j.market || {}); })
      .catch(function () { /* 静默 */ });
  }

  window.mkInstall = install;
  var grid = document.getElementById('mk-grid');
  if(grid){
    grid.addEventListener('click', function(e){
      var b = e.target.closest('[data-mk]');
      if(b) install(b.dataset.mk, b);
    });
  }
  load();
})();
</script>
