<div class="card">
  <h2>安装插件</h2>
  <p>上传 <code>.tar.gz</code> 插件包,或填写插件源 URL(由 nasd 下载安装)。</p>
  <div class="ftools" style="margin-top:12px">
    <label class="btn sm" id="plg-file-label">选择插件包
      <input type="file" id="plg-file" accept=".tar.gz,.tgz" hidden>
    </label>
    <div style="flex:1;min-width:240px">
      <input type="text" id="plg-url" placeholder="https://example.com/plugin.tar.gz">
    </div>
    <button type="button" class="btn primary sm" id="plg-install-url">URL 安装</button>
  </div>
</div>

<div class="card">
  <div class="fbar">
    <h2>插件列表</h2>
    <span class="fcount" id="plg-count"></span>
  </div>
  <table class="ftable">
    <thead>
      <tr><th>插件</th><th>状态</th><th class="col-optional">PID</th><th class="col-optional">重启</th><th style="text-align:right">操作</th></tr>
    </thead>
    <tbody id="plg-rows">
      <tr><td colspan="5" class="fempty">加载中…</td></tr>
    </tbody>
  </table>
</div>

<script>
(function () {
  var stateBadge = {
    'running': 'badge ok', 'stopped': 'badge', 'starting': 'badge warn', 'stopping': 'badge warn',
    'crashed': 'badge err', 'crash-loop': 'badge err'
  };
  var stateText = {
    'running': '运行中', 'stopped': '已停止', 'starting': '启动中',
    'stopping': '停止中', 'crashed': '已崩溃', 'crash-loop': '崩溃循环'
  };

  function openLink(id, path) {
    window.open('/p/' + id + (path || ''), '_blank');
  }

  function act(id, action, btn) {
    if (action === 'uninstall') {
      confirmDialog('卸载插件', '确定卸载插件 ' + id + ' ?').then(function (ok) {
        if (ok) doAct(id, action, btn);
      });
      return;
    }
    doAct(id, action, btn);
  }

  function doAct(id, action, btn) {
    window.setBtnLoading(btn, true);
    fetch('/api/plugins/' + id + '/' + action, { method: action === 'uninstall' ? 'DELETE' : 'POST' })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) toast(res.j.error || '操作失败', 'err');
        else if (action === 'uninstall') toast('已卸载 ' + id, 'ok');
        load();
      })
      .catch(function () { toast('网络错误', 'err'); load(); })
      .finally(function () { window.setBtnLoading(btn, false); });
  }

  function render(list) {
    var tbody = document.getElementById('plg-rows');
    document.getElementById('plg-count').textContent = '共 ' + list.length + ' 个';
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="fempty">暂无插件,请在上方安装</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(function (p) {
      var st = p.state;
      var running = st === 'running';
      var busy = st === 'starting' || st === 'stopping';
      var btns = '';
      if (running) {
        btns += '<button class="btn sm" onclick="plgOpen(\'' + p.id + '\')">打开</button>';
        btns += '<button class="btn sm" onclick="plgAct(\'' + p.id + '\',\'stop\',this)">停止</button>';
        btns += '<button class="btn sm" onclick="plgAct(\'' + p.id + '\',\'restart\',this)">重启</button>';
      } else if (busy) {
        btns += '<span class="badge warn">处理中…</span>';
      } else {
        if (st === 'crash-loop') {
          btns += '<button class="btn sm" onclick="plgAct(\'' + p.id + '\',\'stop\',this)">复位</button>';
        } else {
          btns += '<button class="btn sm" onclick="plgAct(\'' + p.id + '\',\'start\',this)">启动</button>';
        }
        btns += '<button class="btn sm danger" onclick="plgAct(\'' + p.id + '\',\'uninstall\',this)">卸载</button>';
      }
      var name = (p.reg && p.reg.name) ? p.reg.name : p.id;
      var version = (p.reg && p.reg.version) ? ' · v' + p.reg.version : '';
      return '<tr>' +
        '<td><a class="link" onclick="plgOpen(\'' + p.id + '\')"><span class="fico"><svg class="fic" aria-hidden="true"><use href="#i-plugins"/></svg></span>' + name + '</a>' +
        '<div style="font-size:11px;color:var(--muted)">' + p.id + version + ' · ' + window.humanSize(p.size) + '</div></td>' +
        '<td><span class="' + (stateBadge[st] || 'badge') + '">' + (stateText[st] || st) + '</span></td>' +
        '<td class="col-optional">' + (p.pid || '—') + '</td>' +
        '<td class="col-optional">' + (p.restarts || 0) + '</td>' +
        '<td style="text-align:right;white-space:nowrap">' + btns + '</td>' +
        '</tr>';
    }).join('');
  }

  function load() {
    fetch('/api/plugins')
      .then(function (r) { return r.json(); })
      .then(function (j) { render(j.plugins || []); })
      .catch(function () { /* 静默,下轮重试 */ });
  }

  function installURL() {
    var url = document.getElementById('plg-url').value.trim();
    if (!url) { toast('请填写插件源 URL', 'err'); return; }
    var m = url.match(/\/([^/]+?)(?:\.tar\.gz|\.tgz)$/);
    var name = m ? m[1] : '';
    if (!name) { toast('无法从 URL 推断插件名,请使用上传方式', 'err'); return; }
    fetch('/api/plugins/install', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, source: url })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.ok) {
          toast('安装成功', 'ok');
          document.getElementById('plg-url').value = '';
          load();
        } else toast(res.j.error || '安装失败', 'err');
      })
      .catch(function () { toast('网络错误', 'err'); });
  }

  function installUpload(f) {
    if (!f) { toast('请选择插件包文件', 'err'); return; }
    var fd = new FormData();
    fd.append('file', f);
    toast('上传安装中…');
    fetch('/api/plugins/install', { method: 'POST', body: fd })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.ok) {
          toast('安装成功', 'ok');
          document.getElementById('plg-file').value = '';
          load();
        } else toast(res.j.error || '安装失败', 'err');
      })
      .catch(function () { toast('网络错误', 'err'); });
  }

  window.plgAct = act;
  window.plgOpen = openLink;
  document.getElementById('plg-file').addEventListener('change', function (e) { installUpload(e.target.files[0]); });
  document.getElementById('plg-install-url').addEventListener('click', installURL);

  load();
  setInterval(load, 3000);
})();
</script>
