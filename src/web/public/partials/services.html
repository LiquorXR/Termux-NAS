<div class="card">
  <div class="fbar">
    <h2>服务控制</h2>
    <span class="fcount" id="svc-count"></span>
  </div>
  <p>基于 termux-services(runit)的系统服务管理:启停、重启、开机自启。插件相关的服务请到「插件」页管理。</p>
  <table class="ftable" style="margin-top:12px">
    <thead>
      <tr><th>服务</th><th>状态</th><th class="col-optional">PID</th><th class="col-optional">运行时长</th><th>自启</th><th style="text-align:right">操作</th></tr>
    </thead>
    <tbody id="svc-rows">
      <tr><td colspan="6" class="fempty">加载中…</td></tr>
    </tbody>
  </table>
</div>

<script>
(function () {
  var stateBadge = {
    running: 'badge ok', down: 'badge', unknown: 'badge', error: 'badge err'
  };
  var stateText = {
    running: '运行中', down: '已停止', unknown: '未知', error: '异常'
  };

  function svcAct(name, action, btn) {
    window.setBtnLoading(btn, true);
    fetch('/api/svc/' + action, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) toast(res.j.error || '操作失败', 'err');
        load();
      })
      .catch(function () { toast('网络错误', 'err'); load(); })
      .finally(function () { window.setBtnLoading(btn, false); });
  }

  function toggleAutostart(name, sw, btn) {
    btn.disabled = true;
    fetch('/api/svc/autostart', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, enabled: sw.checked })
    })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) { toast(j.error || '设置失败', 'err'); sw.checked = !sw.checked; }
        load();
      })
      .catch(function () { toast('网络错误', 'err'); sw.checked = !sw.checked; load(); })
      .finally(function () { btn.disabled = false; });
  }

  function render(list) {
    var tbody = document.getElementById('svc-rows');
    document.getElementById('svc-count').textContent = '共 ' + list.length + ' 个';
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="fempty">无可用服务</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(function (s) {
      var running = s.state === 'running';
      var btns = '';
      if (running) {
        btns += '<button class="btn sm" onclick="svcAct(\'' + s.name + '\',\'stop\',this)">停止</button>';
        btns += '<button class="btn sm" onclick="svcAct(\'' + s.name + '\',\'restart\',this)">重启</button>';
      } else {
        btns += '<button class="btn sm" onclick="svcAct(\'' + s.name + '\',\'start\',this)">启动</button>';
      }
      var autostart = '<label class="switch">' +
        '<input type="checkbox" ' + (s.autostart ? 'checked' : '') +
        ' onchange="svcToggle(\'' + s.name + '\',this)">' +
        '<span class="track"></span></label>';
      var desc = '<div style="font-size:11px;color:var(--muted)">' + (s.display_name || '') +
        (s.description ? ' · ' + s.description : '') + '</div>';
      return '<tr>' +
        '<td>' + s.name + desc + '</td>' +
        '<td><span class="' + (stateBadge[s.state] || 'badge') + '">' + (stateText[s.state] || s.state) + '</span></td>' +
        '<td class="col-optional">' + (s.pid || '—') + '</td>' +
        '<td class="col-optional">' + (s.uptime || '—') + '</td>' +
        '<td>' + autostart + '</td>' +
        '<td style="text-align:right;white-space:nowrap">' + btns + '</td>' +
        '</tr>';
    }).join('');
  }

  function load() {
    fetch('/api/svc/list')
      .then(function (r) { return r.json(); })
      .then(function (j) { render(j.services || []); })
      .catch(function () { /* 静默重试 */ });
  }

  window.svcAct = svcAct;
  window.svcToggle = toggleAutostart;
  load();
  setInterval(load, 5000);
})();
</script>
