<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
/* 防闪烁:启动前按 localStorage/prefers-color-scheme 设置主题 */
(function () {
  try {
    var t = localStorage.getItem('nas-theme') || 'system';
    var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
})();
</script>
<title>Termux NAS</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#05060a">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
</head>
<body>
<a href="#content" class="sr-only">跳到主内容</a>

<!-- 认证视图(登录 / 首次设置,由 main.js 按 /api/auth/status 切换) -->
<div id="auth-view" hidden>
  <div class="auth-wrap">
    <h1>Termux<span class="dot"> NAS</span></h1>
    <p class="sub" id="auth-sub"></p>
    <form id="auth-form" novalidate>
      <label for="auth-user">用户名</label>
      <input id="auth-user" name="username" autocomplete="username" required aria-describedby="auth-err">
      <label for="auth-pass">密码</label>
      <input id="auth-pass" name="password" type="password" autocomplete="current-password" required aria-describedby="auth-err">
      <div id="auth-pw2-wrap" hidden>
        <label for="auth-pass2">确认密码</label>
        <input id="auth-pass2" type="password" autocomplete="new-password" minlength="8" required aria-describedby="auth-err">
      </div>
      <button type="submit" class="auth-btn" id="auth-btn">登录</button>
      <div class="err" id="auth-err" role="alert" aria-live="polite" aria-atomic="true"></div>
      <p class="auth-alt"><button type="button" id="auth-switch">首次使用?创建管理员账号</button></p>
    </form>
  </div>
</div>

<!-- 主界面 -->
<div id="app-view" hidden>
  <!-- 桌面侧边栏 -->
  <aside class="sidebar" aria-label="侧边栏">
    <div class="brand">
      <svg aria-hidden="true"><use href="#i-logo"/></svg>
      Termux<span class="dot"> NAS</span>
    </div>
    <nav class="snav" aria-label="主导航">
      <button data-nav="files" class="active" aria-current="page" aria-label="文件"><svg aria-hidden="true"><use href="#i-files"/></svg><span>文件</span></button>
      <button data-nav="monitor" aria-label="监控"><svg aria-hidden="true"><use href="#i-monitor"/></svg><span>监控</span></button>
      <button data-nav="plugins" aria-label="插件"><svg aria-hidden="true"><use href="#i-plugins"/></svg><span>插件</span></button>
      <button data-nav="market" aria-label="市场"><svg aria-hidden="true"><use href="#i-market"/></svg><span>市场</span></button>
      <button data-nav="backup" aria-label="备份"><svg aria-hidden="true"><use href="#i-backup"/></svg><span>备份</span></button>
      <button data-nav="settings" aria-label="设置"><svg aria-hidden="true"><use href="#i-settings"/></svg><span>设置</span></button>
    </nav>
    <div class="sidebar-foot">
      <div class="sidebar-user">
        <div class="avatar" id="uname-avatar" aria-hidden="true">U</div>
        <span id="uname"></span>
      </div>
      <div class="sidebar-foot-row">
        <button type="button" class="btn ghost" id="btn-theme" aria-label="切换主题">
          <svg aria-hidden="true" width="14" height="14"><use id="theme-icon" href="#i-moon"/></svg><span id="theme-label">深色</span>
        </button>
        <button type="button" class="btn ghost" id="btn-logout" aria-label="退出登录">
          <svg aria-hidden="true" width="14" height="14"><use href="#i-logout"/></svg><span>退出</span>
        </button>
      </div>
    </div>
  </aside>

  <!-- 移动端顶栏 -->
  <header class="topbar">
    <div class="brand">
      <svg aria-hidden="true"><use href="#i-logo"/></svg>
      Termux<span class="dot"> NAS</span>
    </div>
    <div class="topbar-actions">
      <button type="button" class="icon-btn" id="btn-theme-m" aria-label="切换主题">
        <svg aria-hidden="true"><use id="theme-icon-m" href="#i-moon"/></svg>
      </button>
      <button type="button" class="icon-btn" id="btn-logout-m" aria-label="退出登录">
        <svg aria-hidden="true"><use href="#i-logout"/></svg>
      </button>
    </div>
  </header>

  <main id="content" tabindex="-1"></main>

  <!-- 移动端底部导航 -->
  <nav class="tabbar" aria-label="移动端导航">
    <button data-nav="files" class="active" aria-current="page" aria-label="文件"><svg aria-hidden="true"><use href="#i-files"/></svg>文件</button>
    <button data-nav="monitor" aria-label="监控"><svg aria-hidden="true"><use href="#i-monitor"/></svg>监控</button>
    <button data-nav="plugins" aria-label="插件"><svg aria-hidden="true"><use href="#i-plugins"/></svg>插件</button>
    <button data-nav="market" aria-label="市场"><svg aria-hidden="true"><use href="#i-market"/></svg>市场</button>
    <button id="btn-more" aria-label="更多" aria-expanded="false" aria-controls="sheet-mask"><svg aria-hidden="true"><use href="#i-more"/></svg>更多</button>
  </nav>

  <!-- “更多”底部抽屉 -->
  <div class="sheet-mask" id="sheet-mask" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="更多选项">
      <div class="sheet-handle" aria-hidden="true"></div>
      <button class="sheet-item" data-nav="backup"><svg aria-hidden="true"><use href="#i-backup"/></svg>备份</button>
      <button class="sheet-item" data-nav="settings"><svg aria-hidden="true"><use href="#i-settings"/></svg>设置</button>
    </div>
  </div>
</div>

<!-- 全局 Toast 容器 -->
<div id="toasts" aria-live="polite" aria-atomic="true"></div>

<!-- 全局对话框(确认 / 输入) -->
<div class="dialog-mask" id="dialog-mask" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-text">
    <h3 id="dialog-title"></h3>
    <p class="dialog-text" id="dialog-text"></p>
    <input id="dialog-input" hidden>
    <div class="dialog-btns">
      <button type="button" class="btn" id="dialog-cancel">取消</button>
      <button type="button" class="btn primary" id="dialog-ok">确定</button>
    </div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
