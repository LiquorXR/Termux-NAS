<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Termux NAS</title>
<link rel="stylesheet" href="/css/app.css">
<script src="/vendor/htmx.min.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">Termux<span class="dot"> NAS</span></div>
  <nav class="nav">
    <button hx-get="/partials/files" hx-target="#content" data-nav class="active">文件</button>
    <button hx-get="/partials/monitor" hx-target="#content" data-nav>监控</button>
    <button hx-get="/partials/plugins" hx-target="#content" data-nav>插件</button>
    <button hx-get="/partials/settings" hx-target="#content" data-nav>设置</button>
  </nav>
  <div class="userbox">
    <span id="uname"></span>
    <button hx-post="/api/auth/logout" hx-swap="none">退出</button>
  </div>
</header>
<main id="content"></main>
<script>
// 全局 401 → 登录页
document.body.addEventListener('htmx:responseError', function (evt) {
  if (evt.detail.xhr.status === 401) { location.href = '/login'; }
});
// 导航高亮
document.querySelectorAll('[data-nav]').forEach(function (btn) {
  btn.addEventListener('click', function () {
    document.querySelectorAll('[data-nav]').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
  });
});
// 当前用户
fetch('/api/auth/me').then(function (r) { return r.json(); }).then(function (u) {
  document.getElementById('uname').textContent = u.username;
});
// 默认加载文件面板
htmx.ajax('GET', '/partials/files', { target: '#content' });
</script>
</body>
</html>
