<div class="card" style="margin-bottom:16px">
  <h2>安装插件</h2>
  <p style="margin-bottom:12px">上传 <code>.tar.gz</code> 插件包,或填写插件源 URL(由 nasd 下载安装)。</p>
  <div class="ftools" style="flex-wrap:wrap">
    <div class="fupload">
      <input type="file" id="pkg-file" accept=".tar.gz,.tgz">
      <button type="button" class="btn-mini" onclick="installUpload()">上传安装</button>
    </div>
    <div class="fupload" style="flex:1;min-width:260px">
      <input type="text" id="pkg-url" placeholder="https://example.com/plugin.tar.gz" style="width:100%">
      <button type="button" class="btn-mini" onclick="installURL()">URL 安装</button>
    </div>
  </div>
  <p id="install-msg" class="err" style="min-height:0"></p>
</div>

<div class="card">
  <div class="fbar">
    <h2>插件列表</h2>
    <span class="fcount" id="plugin-count"></span>
  </div>
  <table class="ftable">
    <thead>
      <tr><th>插件</th><th>状态</th><th>PID</th><th>重启</th><th style="text-align:right">操作</th></tr>
    </thead>
    <tbody id="plugin-rows">
      <tr><td colspan="5" class="fempty">加载中…</td></tr>
    </tbody>
  </table>
</div>

<script>
(function () {
  // 状态徽标颜色
  var stateClass = {
    'running': '', 'stopped': '', 'starting': '', 'stopping': '',
    'crashed': 'color:var(--danger)', 'crash-loop': 'color:var(--danger)'
  };
  var stateText = {
    'running': '运行中', 'stopped': '已停止', 'starting': '启动中',
    'stopping': '停止中', 'crashed': '已崩溃', 'crash-loop': '崩溃循环'
  };

  function openLink(id, path) {
    if (path === undefined) path = '';
    window.open('/p/' + id + path, '_blank');
  }

  function act(id, action, btn) {
    if (action === 'uninstall' && !confirm('确定卸载插件 ' + id + ' ?')) return;
    var old = btn.innerHTML;
    btn.disabled = true;
    btn.textContent = '…';
    fetch('/api/plugins/' + id + '/' + action, { method: action === 'uninstall' ? 'DELETE' : 'POST' })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) alert(res.j.error || '操作失败');
        load();
      })
      .catch(function () { alert('网络错误'); load(); })
      .finally(function () { btn.disabled = false; btn.innerHTML = old; });
  }

  function fmtSize(n) {
    if (n < 1024) return n + ' B';
    var u = ['KB', 'MB', 'GB'];
    var i = -1;
    do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
    return n.toFixed(1) + ' ' + u[i];
  }

  function render(list) {
    var tbody = document.getElementById('plugin-rows');
    document.getElementById('plugin-count').textContent = '共 ' + list.length + ' 个';
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="fempty">暂无插件,请在上方安装</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(function (p) {
      var running = p.state === 'running';
      var starting = p.state === 'starting' || p.state === 'stopping';
      var stopped = p.state === 'stopped' || p.state === 'crashed';
      var crash = p.state === 'crash-loop';
      var badge = '<span style="' + (stateClass[p.state] || '') + '">' + (stateText[p.state] || p.state) + '</span>';
      var btns = '';
      if (running) {
        btns += '<button class="btn-mini" onclick="openLink(\'' + p.id + '\')">打开</button>';
        btns += '<button class="btn-mini" onclick="act(\'' + p.id + '\',\'stop\',this)">停止</button>';
        btns += '<button class="btn-mini" onclick="act(\'' + p.id + '\',\'restart\',this)">重启</button>';
      } else if (starting) {
        btns += '<span style="color:var(--muted)">处理中…</span>';
      } else if (crash) {
        btns += '<button class="btn-mini" onclick="act(\'' + p.id + '\',\'stop\',this)">复位</button>';
        btns += '<button class="btn-mini danger" onclick="act(\'' + p.id + '\',\'uninstall\',this)">卸载</button>';
      } else {
        btns += '<button class="btn-mini" onclick="act(\'' + p.id + '\',\'start\',this)">启动</button>';
        btns += '<button class="btn-mini danger" onclick="act(\'' + p.id + '\',\'uninstall\',this)">卸载</button>';
      }
      var name = (p.reg && p.reg.name) ? p.reg.name : p.id;
      var version = (p.reg && p.reg.version) ? ' · v' + p.reg.version : '';
      return '<tr>' +
        '<td><a onclick="openLink(\'' + p.id + '\')"><span class="fico">▸</span>' + name + '</a>' +
        '<div style="font-size:11px;color:var(--muted)">' + p.id + version + ' · ' + fmtSize(p.size) + '</div></td>' +
        '<td>' + badge + '</td>' +
        '<td>' + (p.pid || '—') + '</td>' +
        '<td>' + (p.restarts || 0) + '</td>' +
        '<td style="text-align:right;white-space:nowrap">' + btns + '</td>' +
        '</tr>';
    }).join('');
  }

  function load() {
    fetch('/api/plugins')
      .then(function (r) { return r.json(); })
      .then(function (j) { render(j.plugins || []); })
      .catch(function () { /* 静默,下轮重试 */ });
  }

  function installUpload() {
    var f = document.getElementById('pkg-file').files[0];
    var msg = document.getElementById('install-msg');
    if (!f) { msg.textContent = '请选择插件包文件'; return; }
    var fd = new FormData();
    fd.append('file', f);
    msg.textContent = '上传中…';
    fetch('/api/plugins/install', { method: 'POST', body: fd })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        msg.textContent = res.ok ? '安装成功' : (res.j.error || '安装失败');
        if (res.ok) { document.getElementById('pkg-file').value = ''; load(); }
      })
      .catch(function () { msg.textContent = '网络错误'; });
  }

  function installURL() {
    var url = document.getElementById('pkg-url').value.trim();
    var msg = document.getElementById('install-msg');
    if (!url) { msg.textContent = '请填写插件源 URL'; return; }
    // 从 URL 推断插件名(文件名,去掉 .tar.gz/.tgz)
    var m = url.match(/\/([^/]+?)(?:\.tar\.gz|\.tgz)$/);
    var name = m ? m[1] : '';
    if (!name) { msg.textContent = '无法从 URL 推断插件名,请使用上传方式'; return; }
    msg.textContent = '下载安装中…';
    fetch('/api/plugins/install', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, source: url })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        msg.textContent = res.ok ? '安装成功' : (res.j.error || '安装失败');
        if (res.ok) { document.getElementById('pkg-url').value = ''; load(); }
      })
      .catch(function () { msg.textContent = '网络错误'; });
  }

  window.act = act;
  window.openLink = openLink;
  window.installUpload = installUpload;
  window.installURL = installURL;

  load();
  setInterval(load, 3000); // 3s 轮询状态
})();
</script>
