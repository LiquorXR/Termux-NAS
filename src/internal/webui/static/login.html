<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · Termux NAS</title>
<link rel="stylesheet" href="/css/app.css">
<script src="/vendor/htmx.min.js"></script>
</head>
<body>
<div class="auth-wrap">
  <h1>Termux NAS</h1>
  <p class="sub">登录以继续</p>
  <form hx-post="/api/auth/login" hx-swap="none"
        hx-on::after-request="handleAuth(event, '/')">
    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">登录</button>
    <div class="err" id="err"></div>
  </form>
</div>
<script>
function handleAuth(evt, okUrl) {
  var xhr = evt.detail.xhr;
  if (xhr.status >= 200 && xhr.status < 300) { location.href = okUrl; return; }
  var msg = "请求失败(" + xhr.status + ")";
  try { msg = JSON.parse(xhr.responseText).error || msg; } catch (e) {}
  document.getElementById("err").textContent = msg;
}
</script>
</body>
</html>
