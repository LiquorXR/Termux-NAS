name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      # 必须先构建前端:nasd 经 go:embed 嵌入 src/internal/webui/dist,
      # 而该目录被 .gitignore 排除、不随仓库提交;任何 Go 编译(vet/build/test)
      # 之前都必须先生成 dist,否则报 "pattern dist: no matching files found"。
      - name: Frontend build
        working-directory: src/web
        run: |
          npm ci
          npm run build

      - name: Format check
        working-directory: src
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)" || (echo "gofmt 需要修正:" && gofmt -l . && exit 1)

      - name: Go vet
        working-directory: src
        run: go vet ./...

      - name: Build (host)
        working-directory: src
        run: go build ./...

      - name: Test
        working-directory: src
        run: go test ./...

      - name: Test (race)
        working-directory: src
        run: go test -race ./...

      - name: Android cross-compile
        working-directory: src
        run: CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -o /tmp/nasd-android ./cmd/nasd

      # nas.sh 冒烟测试(机制层 + 运行时层):覆盖"脚本化部署/更新/启停/状态/日志/
      # 校验和篡改防护/卸载",仅需 Linux(bash+curl+go)。复用上方已构建的
      # 前端 dist(go:embed 需要)与 Go 工具链;脚本自产自销测试用 nasd。
      - name: nas.sh smoke test
        working-directory: src
        run: |
          bash ../scripts/smoke-test.sh
